<svg width="1200" height="330" viewBox="0 0 1200 330" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#171513"/>
      <stop offset="0.56" stop-color="#211B17"/>
      <stop offset="1" stop-color="#442113"/>
    </linearGradient>
    <linearGradient id="accent" x1="170" y1="0" x2="1020" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB17A"/>
      <stop offset="0.5" stop-color="#FF7A3D"/>
      <stop offset="1" stop-color="#F0B57F"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .node { fill:#1E1B19; stroke:#5D5149; stroke-width:1.2; }
      .label { fill:#F8F2E9; font-size:13px; font-weight:700; letter-spacing:.08em; }
      .tiny { fill:#B8AAA0; font-size:10px; letter-spacing:.10em; }
      .path { stroke:#6A5143; stroke-width:2; stroke-dasharray:7 9; }
      .pulse { fill:#FF7A3D; filter:url(#glow); }
      @keyframes dash { to { stroke-dashoffset:-64; } }
      @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }
      @keyframes blink { 0%,92%,100%{opacity:.22} 96%{opacity:1} }
      .flow { animation:dash 4s linear infinite; }
      .p1 { animation:pulse 2.6s ease-in-out infinite; }
      .p2 { animation:pulse 2.6s ease-in-out .5s infinite; }
      .p3 { animation:pulse 2.6s ease-in-out 1s infinite; }
      .cursor { animation:blink 1.5s linear infinite; }
    </style>
  </defs>

  <rect width="1200" height="330" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="328" rx="27" stroke="#3A302A"/>

  <circle cx="1070" cy="10" r="185" fill="#E7612D" fill-opacity=".07"/>
  <circle cx="1135" cy="76" r="100" stroke="#FF8A56" stroke-opacity=".12"/>
  <circle cx="72" cy="325" r="155" fill="#FF8A56" fill-opacity=".045"/>

  <text x="64" y="74" class="sans" fill="#F8F2E9" font-size="17" font-weight="700" letter-spacing=".05em">DILIP N.</text>
  <text x="64" y="126" class="sans" fill="#FFF9F0" font-size="40" font-weight="800" letter-spacing="-1.8">AI systems that prove they work.</text>
  <text x="64" y="157" class="mono" fill="#CBBFB6" font-size="12">LLMs · retrieval · agents · evals · serving · MLOps<tspan class="cursor" fill="#FF7A3D">_</tspan></text>

  <line x1="90" y1="230" x2="1105" y2="230" class="path flow"/>

  <!-- Nodes -->
  <g>
    <rect x="70" y="202" width="150" height="56" rx="14" class="node"/>
    <circle cx="92" cy="230" r="5" class="pulse p1"/>
    <text x="107" y="226" class="mono label">POST-TRAIN</text>
    <text x="107" y="243" class="mono tiny">SFT · DPO · QLoRA</text>
  </g>

  <g>
    <rect x="268" y="202" width="138" height="56" rx="14" class="node"/>
    <circle cx="290" cy="230" r="5" class="pulse p2"/>
    <text x="305" y="226" class="mono label">RETRIEVE</text>
    <text x="305" y="243" class="mono tiny">BGE · BM25 · RRF</text>
  </g>

  <g>
    <rect x="454" y="202" width="134" height="56" rx="14" class="node"/>
    <circle cx="476" cy="230" r="5" class="pulse p3"/>
    <text x="491" y="226" class="mono label">AGENTS</text>
    <text x="491" y="243" class="mono tiny">LANGGRAPH · MCP</text>
  </g>

  <g>
    <rect x="636" y="202" width="138" height="56" rx="14" class="node"/>
    <circle cx="658" cy="230" r="5" class="pulse p1"/>
    <text x="673" y="226" class="mono label">EVALUATE</text>
    <text x="673" y="243" class="mono tiny">REGRESSION · CI</text>
  </g>

  <g>
    <rect x="822" y="202" width="132" height="56" rx="14" class="node"/>
    <circle cx="844" cy="230" r="5" class="pulse p2"/>
    <text x="859" y="226" class="mono label">SERVE</text>
    <text x="859" y="243" class="mono tiny">vLLM · FASTAPI</text>
  </g>

  <g>
    <rect x="1002" y="202" width="132" height="56" rx="14" class="node"/>
    <circle cx="1024" cy="230" r="5" class="pulse p3"/>
    <text x="1039" y="226" class="mono label">OBSERVE</text>
    <text x="1039" y="243" class="mono tiny">OTEL · LANGFUSE</text>
  </g>

  <text x="64" y="300" class="mono tiny" fill="#8F8177">BUILD → MEASURE → SHIP → VERIFY</text>
  <text x="1136" y="300" class="mono tiny" fill="#8F8177" text-anchor="end">AI / ML / LLM ENGINEERING · 2026</text>
</svg>
